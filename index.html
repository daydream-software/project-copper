<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline SVG favicon: a copper triangle ship. No asset files to ship. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 6 L24 26 L16 21 L8 26 Z' fill='none' stroke='%23d98a44' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#b87333" />
    <title>Project Copper</title>
  </head>
  <body>
    <main>
      <canvas id="game" width="720" height="720"></canvas>
      <p id="hint">↑ thrust · ← → turn · tap space = gather pulse · shift = scatter · hold space+shift = vortex (charge, then release to fling)</p>
    </main>

    <aside id="panel">
      <h2>Sandbox</h2>
      <fieldset>
        <legend>Gather</legend>
        <label><input type="radio" name="gather" value="pulse" checked /> Pulse</label>
        <label><input type="radio" name="gather" value="attract" /> Attract (hold)</label>
      </fieldset>
      <fieldset>
        <legend>Arena</legend>
        <label><input type="radio" name="edges" value="wrap" checked /> Wrap</label>
        <label><input type="radio" name="edges" value="bounce" /> Bounce</label>
        <label><input type="radio" name="edges" value="kill" /> Kill</label>
        <label><input type="radio" name="edges" value="circle" /> Circle</label>
      </fieldset>
      <fieldset>
        <legend>Motes</legend>
        <label class="range">Count <input type="range" id="opt-moteCount" min="1" max="24" step="1" value="6" /><output>6</output></label>
        <label class="range">Size <input type="range" id="opt-moteSize" min="20" max="80" step="2" value="48" /><output>48</output></label>
        <label class="range">Drift <input type="range" id="opt-moteDrift" min="0" max="160" step="10" value="60" /><output>60</output></label>
      </fieldset>
      <fieldset>
        <legend>Pillars</legend>
        <label class="range">Count <input type="range" id="opt-pillarCount" min="0" max="6" step="1" value="0" /><output>0</output></label>
        <label class="range">Size <input type="range" id="opt-pillarSize" min="24" max="80" step="2" value="40" /><output>40</output></label>
      </fieldset>
      <fieldset>
        <legend>Field</legend>
        <label class="range">Range <input type="range" id="opt-fieldRange" min="120" max="420" step="10" value="260" /><output>260</output></label>
        <label class="range">Strength <input type="range" id="opt-fieldStrength" min="200" max="2400" step="50" value="1100" /><output>1100</output></label>
        <label class="range">Charge <input type="range" id="opt-chargeTime" min="0.3" max="4" step="0.1" value="1.4" /><output>1.4</output></label>
        <label class="range">Swirl <input type="range" id="opt-vortexSwirl" min="200" max="1100" step="20" value="640" /><output>640</output></label>
      </fieldset>
      <label><input type="checkbox" id="opt-scatter" checked /> Scatter</label>
      <label><input type="checkbox" id="opt-vortex" checked /> Vortex</label>
      <label><input type="checkbox" id="opt-gun" /> Gun (press F)</label>
      <label><input type="checkbox" id="opt-chargedSplit" checked /> Charged motes split</label>
      <div class="sub">
        <label><input type="checkbox" id="opt-piercing" /> Piercing (charge persists)</label>
        <label><input type="checkbox" id="opt-chainReaction" /> Chain reaction</label>
      </div>
      <label><input type="checkbox" id="opt-conduction" /> Conduction (charge spreads)</label>
      <label><input type="checkbox" id="opt-bipolar" /> Bipolar (+/− poles)</label>
      <label><input type="checkbox" id="opt-burst" /> Burst (shatter shockwave)</label>
      <label><input type="checkbox" id="opt-stasis" /> Stasis (charge freezes)</label>
      <fieldset>
        <legend>Physics</legend>
        <label><input type="checkbox" id="opt-chargedRepel" /> Charged repel</label>
        <label><input type="checkbox" id="opt-well" /> Gravity well</label>
        <label><input type="checkbox" id="opt-friction" /> Friction</label>
        <label><input type="checkbox" id="opt-moteCollision" /> Mote collisions</label>
        <label><input type="checkbox" id="opt-flow" /> Flow field</label>
      </fieldset>
      <fieldset>
        <legend>Palette</legend>
        <label><input type="radio" name="palette" value="copper" checked /> Copper</label>
        <label><input type="radio" name="palette" value="mono" /> Mono</label>
        <label><input type="radio" name="palette" value="neon" /> Neon</label>
      </fieldset>
      <fieldset>
        <legend>Trails</legend>
        <label><input type="radio" name="trails" value="off" checked /> Off</label>
        <label><input type="radio" name="trails" value="dust" /> Dust</label>
        <label><input type="radio" name="trails" value="full" /> Full</label>
      </fieldset>
      <div class="sub">
        <label><input type="checkbox" id="opt-trailMotes" checked /> Trail motes</label>
      </div>
      <label><input type="checkbox" id="opt-shake" /> Screen shake</label>
      <fieldset>
        <legend>Music</legend>
        <label><input type="radio" name="music" value="off" checked /> Off</label>
        <label><input type="radio" name="music" value="between" /> Between Runs</label>
        <label><input type="radio" name="music" value="autorun" /> Autorun</label>
      </fieldset>
      <label><input type="checkbox" id="opt-sfx" checked /> Sound effects</label>
      <button id="opt-reseed" type="button">⟳ Reseed</button>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
