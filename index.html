<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline SVG favicon: a copper triangle ship. No asset files to ship. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 6 L24 26 L16 21 L8 26 Z' fill='none' stroke='%23d98a44' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#b87333" />
    <title>Project Copper</title>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="600"></canvas>
      <p id="hint">↑ thrust · ← → turn · tap space = gather pulse · shift = scatter · hold space+shift = vortex (charge, then release to fling)</p>
    </main>

    <aside id="panel">
      <h2>Sandbox</h2>
      <fieldset>
        <legend>Gather</legend>
        <label><input type="radio" name="gather" value="pulse" checked /> Pulse</label>
        <label><input type="radio" name="gather" value="attract" /> Attract (hold)</label>
      </fieldset>
      <fieldset>
        <legend>Edges</legend>
        <label><input type="radio" name="edges" value="wrap" checked /> Wrap</label>
        <label><input type="radio" name="edges" value="bounce" /> Bounce</label>
      </fieldset>
      <label><input type="checkbox" id="opt-scatter" checked /> Scatter</label>
      <label><input type="checkbox" id="opt-vortex" checked /> Vortex</label>
      <label><input type="checkbox" id="opt-gun" /> Gun (press F)</label>
      <label><input type="checkbox" id="opt-chargedSplit" checked /> Charged motes split</label>
      <div class="sub">
        <label><input type="checkbox" id="opt-piercing" /> Piercing (charge persists)</label>
        <label><input type="checkbox" id="opt-chainReaction" /> Chain reaction</label>
      </div>
      <label><input type="checkbox" id="opt-conduction" /> Conduction (charge spreads)</label>
      <fieldset>
        <legend>Physics</legend>
        <label><input type="checkbox" id="opt-chargedRepel" /> Charged repel</label>
        <label><input type="checkbox" id="opt-well" /> Gravity well</label>
        <label><input type="checkbox" id="opt-friction" /> Friction</label>
      </fieldset>
      <fieldset>
        <legend>Palette</legend>
        <label><input type="radio" name="palette" value="copper" checked /> Copper</label>
        <label><input type="radio" name="palette" value="mono" /> Mono</label>
        <label><input type="radio" name="palette" value="neon" /> Neon</label>
      </fieldset>
      <label><input type="checkbox" id="opt-trails" /> Trails</label>
      <label><input type="checkbox" id="opt-shake" /> Screen shake</label>
      <fieldset>
        <legend>Music</legend>
        <label><input type="radio" name="music" value="off" checked /> Off</label>
        <label><input type="radio" name="music" value="between" /> Between Runs</label>
        <label><input type="radio" name="music" value="autorun" /> Autorun</label>
      </fieldset>
      <label><input type="checkbox" id="opt-sfx" checked /> Sound effects</label>
      <button id="opt-reseed" type="button">⟳ Reseed</button>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
